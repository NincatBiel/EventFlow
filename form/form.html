<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="formstyle.css">
    <script src="formjs.js" defer></script>
    <link rel="icon" href="">
    <title>EventFlow | Inscrição</title>
</head>
<body>
    <form id="formcadastro">
        <!--Nome-->
        <label for="nome">Nome completo:</label> <br>
        <input type="text" id="nome" name="nome" placeholder="Insira seu nome" required> <br>
        
        <!--CPF-->
         <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf"  placeholder="000.000.000-00" required><br><br>

        <!--E-mail-->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required><br><br>

        <label for="tel">Telefone:</label>
        <input type="text" id="tel" name="tel" placeholder="(00)00000-0000" required><br><br>

        <!--Gênero (radio)-->
        <fieldset>
            <legend>Gênero:</legend>
            <!--M-->
            <input type="radio" id="m" name="genero" value="Masculino" required>
            <label for="m">Masculino</label><br>
            <!--F-->
            <input type="radio" id="f" name="genero" value="Feminino">
            <label for="f">Feminino</label><br>
            <!--Outro-->
            <input type="radio" id="outro" name="genero" value="Outro">
            <label for="outro">Outro</label><br><br>
        </fieldset>

        <!--Endereço-->
        <fieldset>
            <legend>Endereço</legend><br>

            <!--UF-->
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
                <option value="AC">Acre</option>
                <option value="AL">Alagoas</option>
                <option value="AP">Amapá</option>
                <option value="AM">Amazonas</option>
                <option value="BA">Bahia</option>
                <option value="CE">Ceará</option>
                <option value="DF">Distrito Federal</option>
                <option value="ES">Espírito Santo</option>
                <option value="GO">Goiás</option>
                <option value="MA">Maranhão</option>
                <option value="MT">Mato Grosso</option>
                <option value="MS">Mato Grosso do Sul</option>
                <option value="MG">Minas Gerais</option>
                <option value="PA">Pará</option>
                <option value="PB">Paraíba</option>
                <option value="PR">Paraná</option>
                <option value="PE">Pernambuco</option>
                <option value="PI">Piauí</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="RN">Rio Grande do Norte</option>
                <option value="RS">Rio Grande do Sul</option>
                <option value="RO">Rondônia</option>
                <option value="RR">Roraima</option>
                <option value="SC">Santa Catarina</option>
                <option value="SP">São Paulo</option>
                <option value="SE">Sergipe</option>
                <option value="TO">Tocantins</option>
            </select><br><br>
            
            <!--Cidade-->
            <label for="city">Cidade:</label><br>
            <input type="text" id="city" name="city" placeholder="Digite aqui sua cidade" required><br>

            <!-- Completo (bairro, rua, numero) -->
            <label for="endcompleto">Endereço completo:</label><br>
            <input type="text" id="endcompleto" name="endcompleto" placeholder="Bairro, Rua, Número, Complemento" required><br>

            <!-- CEP -->
            <label for="cep">CEP:</label><br>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required><br><br>
        </fieldset>

        <!--Cargo
        o Empresa onde trabalha
        o Tempo de profissão
        o Salário com formatação de duas casas decimais-->


        <!--Palestra-->
        <fieldset>
            <legend>Qual palestra você deseja participar?</legend>

            <label for="lideranca">
                <input type="checkbox" id="lideranca" name="skills" value="Liderança" required>
                🎯 Liderança
            </label>
            <br>

            <label for="inovacao">
                <input type="checkbox" id="inovacao" name="skills" value="Inovação">
                💡 Inovação
            </label>
            <br>

            <label for="networking">
                <input type="checkbox" id="networking" name="skills" value="Networking">
                🤝 Networking
            </label>
            <br>

            <label for="empreendedorismo">
                <input type="checkbox" id="empreendedorismo" name="skills" value="Empreendedorismo">
                📈 Empreendedorismo
            </label>
            <br>

            <label for="inteligencia_emocional">
                <input type="checkbox" id="inteligencia_emocional" name="skills" value="Inteligência Emocional">
                🧠 Inteligência Emocional
            </label>
            <br>

            <label for="marketing_estrategico">
                <input type="checkbox" id="marketing_estrategico" name="skills" value="Marketing Estratégico">
                🚀 Marketing Estratégico
            </label>
        </fieldset>
    </form>
</body>
</html>
